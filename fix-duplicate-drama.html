<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修复连续同剧问题</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            text-align: center;
        }
        h1 { color: #333; margin-bottom: 20px; }
        .status {
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            font-size: 14px;
            text-align: left;
        }
        .info { background: #e7f3ff; color: #004085; }
        .success { background: #d4edda; color: #155724; }
        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin: 10px;
            background: #007bff;
            color: white;
        }
        button:hover { background: #0056b3; }
        pre { 
            background: #f5f5f5; 
            padding: 10px; 
            border-radius: 8px; 
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 修复连续同剧问题</h1>
        
        <div class="status info" id="currentBindings">
            <strong>当前日期绑定：</strong>
            <pre id="bindingsData">加载中...</pre>
        </div>
        
        <button onclick="fixDuplicateDrama()">
            🔄 清除近期绑定并重新选择
        </button>
        
        <div class="status" id="result" style="display:none;"></div>
    </div>

    <script src="quotes.js"></script>
    <script>
        // 显示当前绑定
        function showBindings() {
            let bindings = localStorage.getItem('dateQuoteBindings');
            bindings = bindings ? JSON.parse(bindings) : {};
            
            const entries = Object.entries(bindings).sort().reverse().slice(0, 10);
            let html = '';
            entries.forEach(([date, id]) => {
                const quote = quotes.find(q => q.id === id);
                html += `${date}: ID ${id} - 《${quote?.drama || '未知'}》\n`;
            });
            document.getElementById('bindingsData').textContent = html || '无绑定记录';
        }
        
        function fixDuplicateDrama() {
            let bindings = localStorage.getItem('dateQuoteBindings');
            bindings = bindings ? JSON.parse(bindings) : {};
            
            // 删除最近7天的绑定
            const today = new Date();
            for (let i = 0; i < 7; i++) {
                const d = new Date(today);
                d.setDate(d.getDate() - i);
                const key = d.getFullYear() + '-' + 
                           String(d.getMonth() + 1).padStart(2, '0') + '-' + 
                           String(d.getDate()).padStart(2, '0');
                delete bindings[key];
            }
            
            localStorage.setItem('dateQuoteBindings', JSON.stringify(bindings));
            
            const result = document.getElementById('result');
            result.className = 'status success';
            result.style.display = 'block';
            result.innerHTML = '<strong>✅ 已清除最近7天的绑定！</strong><br>2秒后跳转到主页...';
            
            setTimeout(() => {
                window.location.href = '/';
            }, 2000);
        }
        
        showBindings();
    </script>
</body>
</html>
