<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>检查数据</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .info {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>📊 数据检查</h1>
    <div id="result"></div>
    
    <script>
        const result = document.getElementById('result');
        
        const saved = localStorage.getItem('dailyQuotes');
        
        if (saved) {
            try {
                const data = JSON.parse(saved);
                result.innerHTML = `
                    <div class="info success">
                        <h3>✅ localStorage 中有数据</h3>
                        <p>数据大小: ${saved.length} 字符</p>
                        <p>台词数量: ${data.length} 条</p>
                    </div>
                    <h3>台词列表：</h3>
                    ${data.map((q, i) => `
                        <div class="info">
                            <strong>${i + 1}. ${q.drama} (${q.year})</strong><br>
                            日文: ${q.japanese}<br>
                            中文: ${q.chinese}
                        </div>
                    `).join('')}
                `;
            } catch (e) {
                result.innerHTML = `
                    <div class="info error">
                        <h3>❌ 数据解析失败</h3>
                        <p>${e.message}</p>
                    </div>
                `;
            }
        } else {
            result.innerHTML = `
                <div class="info error">
                    <h3>⚠️ localStorage 中没有数据</h3>
                    <p>dailyQuotes 键为空</p>
                </div>
            `;
        }
    </script>
</body>
</html>
