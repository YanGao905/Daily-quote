<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清理存储 - Daily Quote</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            color: white;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: #2a2a2a;
            border-radius: 16px;
            max-width: 500px;
        }
        h1 { margin: 0 0 20px; font-size: 24px; }
        p { color: #999; line-height: 1.6; margin: 20px 0; }
        button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            font-weight: 600;
        }
        button:hover { background: #ff5252; }
        button.secondary {
            background: #4a4a4a;
        }
        button.secondary:hover { background: #5a5a5a; }
        .success {
            background: #4caf50;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗑️ 清理存储空间</h1>
        <p>这将清空所有已保存的台词数据，释放localStorage空间。</p>
        <p style="color: #ff6b6b;">⚠️ 此操作不可撤销！</p>
        <p>清理后你可以重新添加台词，建议使用图片URL而不是上传大文件。</p>
        
        <button onclick="clearStorage()">确认清理</button>
        <button class="secondary" onclick="location.href='admin.html'">取消</button>
        
        <div class="success" id="success">
            ✅ 清理成功！3秒后自动跳转到管理页面...
        </div>
    </div>

    <script>
        function clearStorage() {
            if (confirm('确定要清空所有数据吗？此操作不可撤销！')) {
                try {
                    localStorage.clear();
                    document.getElementById('success').style.display = 'block';
                    setTimeout(() => {
                        location.href = 'admin.html';
                    }, 3000);
                } catch (e) {
                    alert('清理失败: ' + e.message);
                }
            }
        }
    </script>
</body>
</html>
