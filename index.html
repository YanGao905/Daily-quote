    <script>
// ==================== 核心功能：完全内联 ====================
let currentDayOffset = 0;
let isAnimating = false;
let lastDirection = 0; // 记录上次翻页的方向：-1向前(过去)，1向后(未来)

// 开发者模式：检查URL参数或localStorage
const urlParams = new URLSearchParams(window.location.search);
const isDevMode = urlParams.get('dev') === 'true' || localStorage.getItem('devMode') === 'true';
if (isDevMode) {
    console.log('🔓 开发者模式已启用，无浏览限制');
}

// 从localStorage和quotes.js加载数据（合并两个数据源）
function loadQuotes() {
    let allQuotes = [];
    
    // 1. 优先从quotes.js加载（如果存在）
    if (typeof quotes !== 'undefined' && Array.isArray(quotes) && quotes.length > 0) {
        allQuotes = [...quotes];
        console.log('✓ 从quotes.js加载:', quotes.length, '条台词');
    }
    
    // 2. 从localStorage加载用户添加的台词
    const savedQuotes = localStorage.getItem('dailyQuotes');
    if (savedQuotes) {
        try {
            const localData = JSON.parse(savedQuotes);
            if (Array.isArray(localData) && localData.length > 0) {
                // 合并数据，localStorage的台词优先（覆盖相同ID）
                const localIds = new Set(localData.map(q => q.id));
                allQuotes = allQuotes.filter(q => !localIds.has(q.id));
                allQuotes = [...allQuotes, ...localData];
                console.log('✓ 从localStorage加载:', localData.length, '条台词');
            }
        } catch (e) {
            console.error('✗ localStorage数据解析失败:', e);
        }
    }
    
    if (allQuotes.length === 0) {
        console.warn('⚠️ 没有可用的台词数据');
    } else {
        console.log('✓ 总共加载:', allQuotes.length, '条台词');
    }
    
    return allQuotes;
}

// 获取所有台词
function getAllQuotes() {
    return loadQuotes();
}

// 格式化日期
function formatDate(date) {
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return `${months[date.getMonth()]} ${date.getDate()}`;
}

// 格式化星期
function formatWeekday(date) {
    const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thur', 'Fri', 'Sat'];
    return weekdays[date.getDay()];
}

// 获取指定偏移的日期
function getDateByOffset(offset) {
    const date = new Date();
    date.setDate(date.getDate() + offset);
    return date;
}

// 根据偏移获取台词
function getQuoteByOffset(offset) {
    const allQuotes = getAllQuotes();
    if (!allQuotes || allQuotes.length === 0) {
        console.warn('⚠️ 没有可用的台词数据');
        return null;
    }
    
    // 获取目标日期
    const targetDate = getDateByOffset(offset);
    const dateKey = targetDate.getFullYear() + '-' + 
                   String(targetDate.getMonth() + 1).padStart(2, '0') + '-' + 
                   String(targetDate.getDate()).padStart(2, '0');
    
    // 从localStorage读取日期绑定记录
    let dateBindings = localStorage.getItem('dateQuoteBindings');
    dateBindings = dateBindings ? JSON.parse(dateBindings) : {};
    
    // 如果这个日期已经有绑定的台词，直接返回
    if (dateBindings[dateKey]) {
        const boundId = dateBindings[dateKey];
        const boundQuote = allQuotes.find(q => q.id === boundId);
        if (boundQuote) {
            console.log(`✓ 使用已绑定的台词 (${dateKey}):`, boundQuote.japanese);
            return boundQuote;
        }
    }
    
    // 这个日期是第一次访问，需要选择台词并绑定
    console.log(`📅 首次访问日期: ${dateKey}，选择台词...`);
    
    // 获取或初始化首次使用基准日期
    let firstUseDate = localStorage.getItem('firstUseDate');
    if (!firstUseDate) {
        // 记录今天为基准日期
        const today = new Date();
        firstUseDate = today.getFullYear() + '-' + 
                      String(today.getMonth() + 1).padStart(2, '0') + '-' + 
                      String(today.getDate()).padStart(2, '0');
        localStorage.setItem('firstUseDate', firstUseDate);
        console.log('📍 设置基准日期:', firstUseDate);
    }
    
    // 计算当前日期与基准日期的天数差
    const firstDate = new Date(firstUseDate);
    const daysDiff = Math.floor((targetDate - firstDate) / (1000 * 60 * 60 * 24));
    console.log(`📍 基准日期: ${firstUseDate}, 当前: ${dateKey}, 天数差: ${daysDiff}`);
    
    let selectedQuote;
    
    // 获取前一天的绑定信息（用于避免同剧）
    const yesterday = new Date(targetDate);
    yesterday.setDate(yesterday.getDate() - 1);
    const yesterdayKey = yesterday.getFullYear() + '-' + 
                        String(yesterday.getMonth() + 1).padStart(2, '0') + '-' + 
                        String(yesterday.getDate()).padStart(2, '0');
    const yesterdayId = dateBindings[yesterdayKey];
    const yesterdayQuote = yesterdayId ? allQuotes.find(q => q.id === yesterdayId) : null;
    
    // 前7天（基准日及往回6天）使用固定的精选内容
    if (daysDiff >= -6 && daysDiff <= 0 && typeof firstTimeQuoteIds !== 'undefined') {
        const arrayIndex = Math.abs(daysDiff);  // daysDiff=0→index 0, daysDiff=-1→index 1
        const selectedId = firstTimeQuoteIds[arrayIndex];
        selectedQuote = allQuotes.find(q => q.id === selectedId);
        
        // 如果精选内容和前一天同剧，选择不同的
        if (selectedQuote && yesterdayQuote && selectedQuote.drama === yesterdayQuote.drama) {
            console.log(`⚠️ 精选内容《${selectedQuote.drama}》与前一天重复，重新选择...`);
            const differentDramaQuotes = allQuotes.filter(q => q.drama !== yesterdayQuote.drama);
            if (differentDramaQuotes.length > 0) {
                const dateHash = parseInt(dateKey.replace(/-/g, ''));
                const index = dateHash % differentDramaQuotes.length;
                selectedQuote = differentDramaQuotes[index];
            }
        }
        
        if (selectedQuote) {
            console.log(`✨ 使用精选内容: daysDiff=${daysDiff}, arrayIndex=${arrayIndex}, id=${selectedId}, ${selectedQuote.drama}`);
        } else {
            console.warn(`⚠️ 未找到ID为${selectedId}的台词`);
        }
    }
    
    // 如果不是前7天，或者前7天没找到，就自动选择
    if (!selectedQuote) {
        if (yesterdayQuote) {
            // 前一天有记录，找一个不同剧的台词
            const differentDramaQuotes = allQuotes.filter(q => q.drama !== yesterdayQuote.drama);
            
            if (differentDramaQuotes.length > 0) {
                const dateHash = parseInt(dateKey.replace(/-/g, ''));
                const index = dateHash % differentDramaQuotes.length;
                selectedQuote = differentDramaQuotes[index];
                console.log(`🔄 避免重复《${yesterdayQuote.drama}》，选择《${selectedQuote.drama}》`);
            } else {
                const dateHash = parseInt(dateKey.replace(/-/g, ''));
                const index = dateHash % allQuotes.length;
                selectedQuote = allQuotes[index];
            }
        } else {
            // 前一天没有记录，基于日期哈希选择
            const dateHash = parseInt(dateKey.replace(/-/g, ''));
            const index = dateHash % allQuotes.length;
            selectedQuote = allQuotes[index];
            console.log(`✨ 自动选择台词:`, selectedQuote.japanese);
        }
    }
    
    // 绑定并保存
    dateBindings[dateKey] = selectedQuote.id;
    localStorage.setItem('dateQuoteBindings', JSON.stringify(dateBindings));
    console.log(`💾 已保存绑定: ${dateKey} → ID ${selectedQuote.id} ${selectedQuote.drama}`);
    
    return selectedQuote;
}

// 解析振假名格式：{汉字}[かんじ] => <ruby>汉字<rt>かんじ</rt></ruby>
function parseFurigana(text) {
    if (!text) return '';
    // 处理 {汉字}[读音] 格式
    text = text.replace(/\{([^\}]+)\}\[([^\]]+)\]/g, '<ruby>$1<rt>$2</rt></ruby>');
    return text;
}

// 更新UI显示
function updateDisplay(offset = 0, direction = 0) {
    const container = document.getElementById('container');
    const endContent = document.getElementById('endContent');
    const historyEndContent = document.getElementById('historyEndContent');
    const normalContent = document.getElementById('normalContent');
    const japaneseQuote = document.getElementById('japanese-quote');
    const chineseQuote = document.getElementById('chinese-quote');
    const imageSection = document.querySelector('.image-section');
    
    // 如果是未来日期（offset > 0），显示终了页面
    if (offset > 0) {
        endContent.style.display = 'flex';
        historyEndContent.style.display = 'none';
        normalContent.style.display = 'none';
        
        // 启动終了页面动画
        animateEndPage();
        return;
    }
    
    // 如果往回翻超过7天（offset <= -7），显示历史结束页面（开发者模式跳过）
    if (offset <= -7 && !isDevMode) {
        endContent.style.display = 'none';
        historyEndContent.style.display = 'flex';
        normalContent.style.display = 'none';
        
        // 触发历史结束页面动画
        animateHistoryEndPage();
        return;
    }
    
    // 显示正常内容
    endContent.style.display = 'none';
    historyEndContent.style.display = 'none';
    normalContent.style.display = 'block';
    
    // 移除之前的动画类
    japaneseQuote.classList.remove('animate-fadeInUp-1', 'animate-fadeInUp-2', 'animate-fadeInUp-3', 'animate-fadeInDown-1', 'animate-fadeInDown-2', 'animate-fadeInDown-3');
    chineseQuote.classList.remove('animate-fadeInUp-1', 'animate-fadeInUp-2', 'animate-fadeInUp-3', 'animate-fadeInDown-1', 'animate-fadeInDown-2', 'animate-fadeInDown-3');
    imageSection.classList.remove('animate-fadeInUp-1', 'animate-fadeInUp-2', 'animate-fadeInUp-3', 'animate-fadeInDown-1', 'animate-fadeInDown-2', 'animate-fadeInDown-3');
    
    const targetDate = getDateByOffset(offset);
    const quote = getQuoteByOffset(offset);
    
    // 更新日期
    document.getElementById('date').textContent = formatDate(targetDate);
    document.getElementById('weekday').textContent = formatWeekday(targetDate);
    
    if (!quote) {
        document.getElementById('japanese-quote').textContent = '还没有添加台词';
        document.getElementById('chinese-quote').textContent = '请前往管理页面添加台词';
        document.getElementById('quote-image').style.display = 'none';
        document.getElementById('drama-info').textContent = '';
        return;
    }
    
    // 更新台词（使用振假名）
    const jpElement = document.getElementById('japanese-quote');
    if (quote.furigana) {
        jpElement.innerHTML = parseFurigana(quote.furigana);
    } else {
        jpElement.textContent = quote.japanese || '';
    }
    document.getElementById('chinese-quote').textContent = quote.chinese || '';
    document.getElementById('drama-info').textContent = `${quote.drama || ''} ${quote.year ? '(' + quote.year + ')' : ''}`;
    
    // 更新图片
    const img = document.getElementById('quote-image');
    if (quote.image) {
        img.src = quote.image;
        img.style.display = 'block';
        img.onerror = () => img.style.display = 'none';
    } else {
        img.style.display = 'none';
    }
    
    // 添加错位动画
    if (offset <= 0) {
        // 强制重绘以重启动画
        void japaneseQuote.offsetWidth;
        void chineseQuote.offsetWidth;
        void imageSection.offsetWidth;
        
        if (direction < 0) {
            // 往回翻（看过去）：从上往下，图片→中文→日语
            imageSection.classList.add('animate-fadeInDown-1');
            chineseQuote.classList.add('animate-fadeInDown-2');
            japaneseQuote.classList.add('animate-fadeInDown-3');
        } else if (direction > 0) {
            // 往前翻（从过去往现在）：从下往上，日语→中文→图片
            japaneseQuote.classList.add('animate-fadeInUp-1');
            chineseQuote.classList.add('animate-fadeInUp-2');
            imageSection.classList.add('animate-fadeInUp-3');
        }
    }
}

// 导航功能
function navigate(direction) {
    if (isAnimating) return;
    
    // 如果当前在历史结束页面（offset <= -7），且非开发者模式
    if (currentDayOffset <= -7 && !isDevMode) {
        // 从历史结束页面只能往未来翻（回到第7天）
        if (direction === 1) {
            isAnimating = true;
            currentDayOffset = -6;
            updateDisplay(currentDayOffset, direction);
            setTimeout(() => isAnimating = false, 400);
        }
        // 不允许继续往过去翻
        return;
    }
    
    // 如果当前在未来结束页面（offset > 0）
    if (currentDayOffset > 0) {
        // 从未来结束页面只能往过去翻（回到今天）
        if (direction === -1) {
            isAnimating = true;
            currentDayOffset = 0;
            updateDisplay(currentDayOffset, direction);
            setTimeout(() => isAnimating = false, 400);
        }
        // 不允许继续往未来翻
        return;
    }
    
    isAnimating = true;
    lastDirection = direction;
    currentDayOffset += direction;
    updateDisplay(currentDayOffset, direction);
    setTimeout(() => isAnimating = false, 400);
}

// 終了页面动画
function animateEndPage() {
    const endJapanese = document.getElementById('endJapanese');
    const endChinese = document.getElementById('endChinese');
    const endToday = document.getElementById('endToday');
    const endText = document.getElementById('endText');
    
    // 重置动画
    endJapanese.classList.remove('animate');
    endChinese.classList.remove('animate');
    endToday.innerHTML = '';
    endText.innerHTML = '';
    
    // 1. 先显示日文（延迟200ms开始）
    setTimeout(() => {
        endJapanese.classList.add('animate');
    }, 200);
    
    // 2. 显示中文（日文动画开始后300ms）
    setTimeout(() => {
        endChinese.classList.add('animate');
    }, 500);
    
    // 3. 逐字显示"また"（中文显示后600ms开始）
    setTimeout(() => {
        const todayText = 'また';
        todayText.split('').forEach((char, index) => {
            setTimeout(() => {
                const span = document.createElement('span');
                span.textContent = char;
                span.classList.add('animate');
                span.style.animationDelay = '0s';
                endToday.appendChild(span);
            }, index * 200);
        });
    }, 1100);
    
    // 4. 逐字显示"明日"（"また"显示完后200ms）
    setTimeout(() => {
        const textText = '明日';
        const spans = [];
        
        // 先创建所有字符的span占位
        textText.split('').forEach((char) => {
            const span = document.createElement('span');
            span.textContent = char;
            span.style.opacity = '0';
            endText.appendChild(span);
            spans.push(span);
        });
        
        // 逐个显示字符
        spans.forEach((span, index) => {
            setTimeout(() => {
                span.classList.add('animate');
                span.style.opacity = '';
            }, index * 200);
        });
    }, 1900);
}

// 历史结束页面动画
function animateHistoryEndPage() {
    const jpContainer = document.querySelector('.history-end-japanese');
    const cnContainer = document.querySelector('.history-end-chinese');
    
    // 日文文本（每行）
    const jpTexts = [
        'ここまで来たあなたに、',
        'ありがとう。',
        '少しでも、軽くなっていたら',
        'いい。'
    ];
    
    // 中文文本（每行）
    const cnTexts = [
        '谢谢你走到这里',
        '希望此刻，能让你轻松一点',
        '我们明天见'
    ];
    
    // 清空容器
    jpContainer.innerHTML = '';
    cnContainer.innerHTML = '';
    
    let delay = 0;
    const charDelay = 80; // 每个字的延迟
    const lineGap = 150; // 行与行之间的额外间隔
    
    // 逐字显示日文
    jpTexts.forEach((text, lineIndex) => {
        const lineDiv = document.createElement('div');
        lineDiv.className = 'history-jp-line';
        lineDiv.style.opacity = '1'; // 行本身始终可见
        jpContainer.appendChild(lineDiv);
        
        // 将每个字符包装在span中
        text.split('').forEach((char, charIndex) => {
            const span = document.createElement('span');
            span.textContent = char;
            span.style.opacity = '0';
            lineDiv.appendChild(span);
            
            // 设置延迟显示
            setTimeout(() => {
                span.style.transition = 'opacity 0.3s ease';
                span.style.opacity = '1';
            }, delay + charIndex * charDelay);
        });
        
        delay += text.length * charDelay + lineGap;
    });
    
    // 在日文显示完后，逐字显示中文
    delay += 200; // 日文和中文之间的间隔
    
    cnTexts.forEach((text, lineIndex) => {
        const lineDiv = document.createElement('div');
        lineDiv.className = 'history-cn-line';
        lineDiv.style.opacity = '1';
        cnContainer.appendChild(lineDiv);
        
        text.split('').forEach((char, charIndex) => {
            const span = document.createElement('span');
            span.textContent = char;
            span.style.opacity = '0';
            lineDiv.appendChild(span);
            
            setTimeout(() => {
                span.style.transition = 'opacity 0.3s ease';
                span.style.opacity = '1';
            }, delay + charIndex * charDelay);
        });
        
        delay += text.length * charDelay + lineGap;
    });
}

// ==================== 音乐播放器 ====================
class GlobalMusicPlayer {
    constructor() {
        this.audio = null;
        this.storageKey = 'globalMusicState';
        this.updateInterval = null;
        this.init();
    }

    init() {
        // 监听其他标签页的状态变化
        window.addEventListener('storage', (e) => {
            if (e.key === this.storageKey) {
                this.syncFromStorage();
            }
        });

        // 页面可见性变化时同步状态
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                this.syncFromStorage();
            }
        });

        // 页面卸载前保存状态
        window.addEventListener('beforeunload', () => {
            this.saveState();
        });

        window.addEventListener('pagehide', (e) => {
            this.saveState();
        });
    }

    // 初始化音频元素
    setAudio(audioElement) {
        this.audio = audioElement;
        
        // 监听播放状态变化
        this.audio.addEventListener('play', () => this.saveState());
        this.audio.addEventListener('pause', () => this.saveState());
        this.audio.addEventListener('volumechange', () => this.saveState());
        this.audio.addEventListener('loadedmetadata', () => this.saveState());
        
        // 定期保存播放进度
        this.audio.addEventListener('timeupdate', () => {
            if (this.audio.played.length > 0) {
                this.saveState();
            }
        });

        // 从存储中恢复状态
        this.syncFromStorage();
    }

    // 保存当前播放状态
    saveState() {
        if (!this.audio) return;

        const state = {
            src: this.audio.src,
            currentTime: this.audio.currentTime,
            volume: this.audio.volume,
            muted: this.audio.muted,
            playing: !this.audio.paused,
            timestamp: Date.now()
        };

        try {
            localStorage.setItem(this.storageKey, JSON.stringify(state));
        } catch (e) {
            console.error('保存音乐状态失败:', e);
        }
    }

    // 从存储中恢复状态
    syncFromStorage() {
        if (!this.audio) return;

        try {
            const savedState = localStorage.getItem(this.storageKey);
            if (!savedState) return;

            const state = JSON.parse(savedState);
            
            // 检查状态是否过期（超过5秒认为是旧状态）
            if (Date.now() - state.timestamp > 5000) {
                return;
            }

            // 如果音频源不同，加载新音频
            if (state.src && state.src !== this.audio.src) {
                this.audio.src = state.src;
            }

            // 恢复播放进度
            if (state.currentTime !== undefined && Math.abs(this.audio.currentTime - state.currentTime) > 1) {
                this.audio.currentTime = state.currentTime;
            }

            // 恢复音量和静音状态
            if (state.volume !== undefined) {
                this.audio.volume = state.volume;
            }
            if (state.muted !== undefined) {
                this.audio.muted = state.muted;
            }

            // 恢复播放状态
            if (state.playing && this.audio.paused) {
                // 尝试自动播放（可能受浏览器策略限制）
                const playPromise = this.audio.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.log('自动播放被阻止，需要用户交互:', error);
                    });
                }
            }
        } catch (e) {
            console.error('恢复音乐状态失败:', e);
        }
    }

    // 清除状态
    clearState() {
        try {
            localStorage.removeItem(this.storageKey);
        } catch (e) {
            console.error('清除音乐状态失败:', e);
        }
    }
}

// 初始化
document.addEventListener('DOMContentLoaded', () => {
    // 初始化音乐播放器（禁用跨页面同步，避免状态冲突）
    // const globalMusicPlayer = new GlobalMusicPlayer();
    const bgMusic = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');
    
    // globalMusicPlayer.setAudio(bgMusic);
    
    // 显示今天的台词
    updateDisplay(0);
    
    // 从今天的台词加载音乐并自动播放
    const todayQuote = getQuoteByOffset(0);
    console.log('今日台词数据:', todayQuote);
    if (todayQuote && todayQuote.music) {
        console.log('✓ 找到音乐:', todayQuote.music);
        bgMusic.src = todayQuote.music;
        bgMusic.loop = true;
        
        // 尝试自动播放：先静音播放，成功后再设置音量
        bgMusic.muted = true;
        bgMusic.volume = 0.3;
        
        const playPromise = bgMusic.play();
        if (playPromise !== undefined) {
            playPromise.then(() => {
                console.log('✓ 音乐自动播放成功');
                // 播放成功后取消静音
                setTimeout(() => {
                    bgMusic.muted = false;
                }, 100);
                musicBtn.classList.add('playing');
            }).catch(err => {
                console.log('⚠️ 自动播放被阻止，请点击音乐按钮手动播放');
                bgMusic.muted = false;
                musicBtn.classList.remove('playing');
            });
        }
    } else {
        console.warn('⚠️ 今日台词没有音乐字段，music =', todayQuote?.music);
    }
    
    // 监听播放状态变化，控制旋转动画
    bgMusic.addEventListener('play', () => {
        musicBtn.classList.add('playing');
    });
    
    bgMusic.addEventListener('pause', () => {
        musicBtn.classList.remove('playing');
    });
    
    // 音乐按钮点击事件：切换播放/暂停
    musicBtn.addEventListener('click', () => {
        console.log('🎵 音乐按钮被点击');
        console.log('  - paused:', bgMusic.paused);
        console.log('  - currentTime:', bgMusic.currentTime);
        console.log('  - src:', bgMusic.src);
        console.log('  - readyState:', bgMusic.readyState);
        
        if (bgMusic.paused) {
            console.log('  → 执行播放');
            bgMusic.play().then(() => {
                console.log('  ✓ 播放成功，paused=', bgMusic.paused);
            }).catch(err => {
                console.error('  ✗ 播放失败:', err);
            });
        } else {
            console.log('  → 执行暂停');
            bgMusic.pause();
            console.log('  ✓ 暂停完成，paused=', bgMusic.paused);
        }
    });
    
    // 绑定键盘事件
    document.addEventListener('keydown', (e) => {
        // 左箭头或上箭头：前一天
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            e.preventDefault();
            navigate(-1);
        }
        // 右箭头或下箭头：后一天
        else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
            e.preventDefault();
            navigate(1);
        }
    });
    
    // 触摸手势支持（手机端，跟手拖动）
    let touchStartY = 0;
    let touchCurrentY = 0;
    let isDragging = false;
    const minSwipeDistance = 80;
    const damping = 0.6;
    const normalContent = document.getElementById('normalContent');
    
    document.addEventListener('touchstart', (e) => {
        if (isAnimating) return;
        touchStartY = e.touches[0].clientY;
        touchCurrentY = touchStartY;
        isDragging = true;
        normalContent.style.transition = 'none';
    }, { passive: true });
    
    document.addEventListener('touchmove', (e) => {
        if (!isDragging || isAnimating) return;
        touchCurrentY = e.touches[0].clientY;
        const deltaY = touchCurrentY - touchStartY;
        const translateY = deltaY * damping;
        
        // 根据拖动距离计算透明度 (0-1)
        const dragProgress = Math.min(Math.abs(deltaY) / 300, 1); // 拖动300px达到完全透明
        const opacity = 1 - dragProgress * 0.7; // 最多降到30%透明度
        
        normalContent.style.transform = `translate3d(0, ${translateY}px, 0)`;
        normalContent.style.opacity = opacity;
    }, { passive: true });
    
    document.addEventListener('touchend', (e) => {
        if (!isDragging) return;
        isDragging = false;
        
        const swipeDistance = touchCurrentY - touchStartY;
        normalContent.style.transition = 'transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.4s ease-out';
        
        if (Math.abs(swipeDistance) > minSwipeDistance) {
            if (swipeDistance > 0) {
                normalContent.style.transform = 'translate3d(0, 100vh, 0)';
                normalContent.style.opacity = '0';
                setTimeout(() => {
                    navigate(-1);
                    setTimeout(() => {
                        normalContent.style.transition = 'none';
                        normalContent.style.transform = '';
                        normalContent.style.opacity = '1';
                        setTimeout(() => {
                            normalContent.style.transition = '';
                        }, 50);
                    }, 50);
                }, 200);
            } else {
                normalContent.style.transform = 'translate3d(0, -100vh, 0)';
                normalContent.style.opacity = '0';
                setTimeout(() => {
                    navigate(1);
                    setTimeout(() => {
                        normalContent.style.transition = 'none';
                        normalContent.style.transform = '';
                        normalContent.style.opacity = '1';
                        setTimeout(() => {
                            normalContent.style.transition = '';
                        }, 50);
                    }, 50);
                }, 200);
            }
        } else {
            normalContent.style.transform = 'translate3d(0, 0, 0)';
            normalContent.style.opacity = '1';
        }
    })

    // 触控板/鼠标滚轮支持（PC端，针对Mac触控板优化）
    let wheelTimeout;
    let wheelDelta = 0;
    const wheelThreshold = 50; // 降低阈值，适配Mac触控板
    
    document.addEventListener('wheel', (e) => {
        if (isAnimating) return;
        
        // 阻止默认滚动行为
        e.preventDefault();
        
        // 累积垂直滚动距离
        wheelDelta += e.deltaY;
        
        // 清除之前的超时
        clearTimeout(wheelTimeout);
        
        // 设置新的超时，降低延迟提升响应速度
        wheelTimeout = setTimeout(() => {
            if (Math.abs(wheelDelta) >= wheelThreshold) {
                if (wheelDelta > 0) {
                    // 向下滚动：下一天
                    navigate(1);
                } else {
                    // 向上滚动：上一天
                    navigate(-1);
                }
            }
            wheelDelta = 0; // 重置累积值
        }, 60); // 降低延迟从150ms到60ms，提升响应速度
    }, { passive: false }); // 改为false以便preventDefault
});
    </script>
